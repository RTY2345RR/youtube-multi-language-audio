[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "youtube-multi-language-audio"
version = "0.1.0"
description = "YouTube multi-language audio tracks from your subtitles: AI dubbing in your own cloned voice, time-synced to every cue, one upload-ready track per language for YouTube Studio."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RTY2345RR" }]
keywords = [
  "youtube-multi-language-audio", "youtube-multiple-audio-tracks", "multi-language-audio", "auto-dubbing",
  "youtube-dubbing", "ai-dubbing", "audio-tracks", "srt-to-speech", "subtitle-to-speech", "voice-cloning",
  "dubbing", "video-translation", "youtube", "srt", "text-to-speech", "auto-synced-translated-dubs-alternative",
  "miragea",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "httpx>=0.27",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build"]

[project.urls]
Homepage = "https://github.com/RTY2345RR/youtube-multi-language-audio"
Repository = "https://github.com/RTY2345RR/youtube-multi-language-audio"
Documentation = "https://github.com/RTY2345RR/youtube-multi-language-audio#readme"
Issues = "https://github.com/RTY2345RR/youtube-multi-language-audio/issues"
Changelog = "https://github.com/RTY2345RR/youtube-multi-language-audio/blob/main/CHANGELOG.md"
"Voice engine" = "https://miragea.ai"

[project.scripts]
youtube-multi-language-audio = "youtube_multi_language_audio.cli:main"
ytmla = "youtube_multi_language_audio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_multi_language_audio"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "CREDITS.md", "CHANGELOG.md", "llms.txt", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
